<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>overwhelming interaction</title>

  <!-- הפונט Advent Pro מ-Google Fonts (כמו בפיגמה) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- השעון: מתחיל ב-23:59:45 ומתקדם כמו שעון אמיתי -->
  <p class="timer">23:59:45</p>

  <!-- המשפט במרכז -->
  <h1 class="message">paper<br>complete!</h1>

  <!-- הכפתור: hover פותח את המשחק -->
  <button class="submit-button" type="button">SUBMIT</button>

  <script>
    // הופך מספר שניות מאז חצות לטקסט בצורה 23:59:45
    function formatTime(totalSeconds) {
      totalSeconds = totalSeconds % (24 * 60 * 60);  // אחרי 23:59:59 חוזרים ל-00:00:00
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map(function (number) { return String(number).padStart(2, "0"); })
        .join(":");
    }

    // השעון מתקדם בשנייה כל שנייה
    const clock = document.querySelector(".timer");
    let clockSeconds = 23 * 3600 + 59 * 60 + 45;  // 23:59:45

    setInterval(function () {
      clockSeconds = clockSeconds + 1;
      clock.textContent = formatTime(clockSeconds);

      // ב-00:00:10 המשחק מתחיל מחדש (השעון חוזר ל-23:59:45)
      if (clock.textContent === "00:00:10") {
        window.location.href = "index.html";
      }
    }, 1000);

    // כשהעכבר עובר מעל SUBMIT, עוברים לעמוד המשחק
    const submitButton = document.querySelector(".submit-button");
    submitButton.addEventListener("mouseenter", function () {
      window.location.href = "game.html";
    });
  </script>

</body>
</html>
