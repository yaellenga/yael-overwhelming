<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>overwhelming interaction</title>

  <!-- הפונטים Advent Pro ו-Arimo מ-Google Fonts (כמו בפיגמה) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@700&family=Arimo:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">

  <!-- הכותרת (פריים 82:849) -->
  <!-- לחיצה מתחילה מחדש: חוזרים למסך הראשון -->
  <a class="day-title restart-link title-font" href="index.html">organize the day</a>

  <!-- ציר השעות שנשארו היום (נוצר ב-JavaScript למטה) -->
  <ol class="timeline"></ol>

  <!-- האריחים של המשימות נוצרים ב-JavaScript למטה -->

  <!-- הסיכום בצד ימין (המספרים מגיעים מהמסך הקודם) -->
  <p class="tasks-label">tasks to do today:</p>
  <p class="tasks-count title-font">0</p>

  <p class="time-label">estimated time:</p>
  <p class="hours-count title-font">0</p>
  <p class="hours-word">hours</p>

</div>

  <!-- התאמה למסך (משותף לכל העמודים) -->
  <script src="shared.js"></script>

  <script>
    // ---------- הסיכום מהמסך הקודם ----------
    const tasksCountText = document.querySelector(".tasks-count");
    const hoursCountText = document.querySelector(".hours-count");
    let tasksCount = Number(sessionStorage.getItem("tasksCount") || 0);
    let totalHours = Number(sessionStorage.getItem("totalHours") || 0);

    // מציג את המספרים. מספר שגדל "נושם": גדל וקטן במשך שנייה
    const TOO_MANY_TASKS = 25;  // מכאן מספר המשימות נצבע באדום

    function showSummary() {
      updateNumber(tasksCountText, tasksCount);
      updateNumber(hoursCountText, totalHours);
      tasksCountText.classList.toggle("too-many", tasksCount >= TOO_MANY_TASKS);
    }

    function updateNumber(element, newValue) {
      const grew = newValue > Number(element.textContent);
      element.textContent = newValue;
      if (grew) {
        element.classList.remove("breathe");
        element.offsetWidth;               // מאפס את האנימציה כדי שתתחיל מחדש
        element.classList.add("breathe");
      }
    }

    showSummary();

    // ---------- "organize the day": מתחילים מחדש ----------
    // מוחקים את מה שנשמר מהמסך הקודם, והקישור מחזיר למסך הראשון
    document.querySelector(".restart-link").addEventListener("click", function () {
      sessionStorage.clear();
    });

    // ---------- ציר השעות: רק השעות שנשארו היום ----------
    // מתחיל בשעה העגולה הבאה ונגמר ב-00:00. למשל ב-20:58: 21:00, 22:00, 23:00, 00:00
    const timeline = document.querySelector(".timeline");
    let timelineStartHour;

    function buildTimeline() {
      const nextHour = new Date().getHours() + 1;
      if (nextHour === timelineStartHour) return;  // השעה לא התחלפה, אין מה לעדכן
      timelineStartHour = nextHour;

      timeline.innerHTML = "";
      for (let hour = nextHour; hour <= 24; hour++) {
        const label = document.createElement("li");
        label.textContent = hour === 24 ? "00:00" : hour + ":00";
        timeline.appendChild(label);
      }
    }

    buildTimeline();
    setInterval(buildTimeline, 1000);  // כשהשעה מתחלפת, השעה הראשונה נעלמת

    // ---------- האריחים: מגדל לכל קטגוריה (פריים 82:849) ----------
    // בהתחלה: אריח לכל משימה שנבחרה, בתחתית המסך.
    // אחר כך אריחים חדשים נופלים מלמעלה ונערמים על המגדל של הקטגוריה שלהם
    const FRAME_WIDTH = 1512, FRAME_HEIGHT = 982;
    const TOWERS_LEFT = 423;        // המגדל הראשון מתחיל ב-25%+45px, כמו בעיצוב
    const TOWER_WIDTH = 200;        // בערך הרוחב של מגדל בעיצוב. אריחים צרים יכולים לנחות קצת ימינה או שמאלה
    const TILE_MIN_WIDTH = 45,  TILE_MAX_WIDTH = 185;    // הגדלים של האריחים בעיצוב
    const TILE_MIN_HEIGHT = 53, TILE_MAX_HEIGHT = 120;   // עד גובה בינוני
    const TILE_WIDEST = 300;        // טקסט ארוך: האריח מתרחב עד כאן כדי לא להיות גבוה מדי
    // הסיכום בצד ימין למעלה: מגדל לא עולה מעל התחתית שלו (המילה hours), כדי לא לכסות את המספרים
    const SUMMARY_LEFT = 1289;      // 81.25%+60.5px, איפה שהמספרים מתחילים
    const SUMMARY_BOTTOM = 292;     // התחתית של "hours" (263px + גובה השורה)
    const TILE_PADDING = 8;         // הרווח בצדדים של הטקסט (כמו --cube-padding ב-CSS)
    const FULL_FALL_TIME = 1600;    // כמה זמן לוקחת נפילה מלמעלה עד למטה (מילישניות). נפילה קצרה מהירה יותר
    const LANDING_TIME = 250;       // משך ה"מכה" בנחיתה (כמו --landing-time ב-CSS)
    const KID_DROP_SPREAD = 1500;   // אריחים שנופלים יחד מתחילים בזמן אקראי, עד 1.5 שניות אחד מהשני

    const screen = document.querySelector(".screen");
    const selectedTasks = JSON.parse(sessionStorage.getItem("selectedTasks") || "[]");
    let topLayer = 1;  // אריח חדש או נגרר תמיד עולה מעל כולם

    // מספר אקראי בין min ל-max
    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    // מספר המגדלים = מספר הקטגוריות שנבחרו. מפוזרים בשווה עד הקצה הימני.
    // בהתחלה כל קטגוריה בבסיס של מגדל משלה, ואחר כך אריחים נופלים למגדלים אקראיים (המגדלים מתערבבים)
    const categories = [];
    selectedTasks.forEach(function (task) {
      if (!categories.includes(task.category)) categories.push(task.category);
    });
    const columnWidth = (FRAME_WIDTH - TOWERS_LEFT) / Math.max(categories.length, 1);

    // מרכז המגדל. towerNumber מתחיל מ-0 (המגדל הכי שמאלי)
    function towerCenter(towerNumber) {
      return TOWERS_LEFT + columnWidth * (towerNumber + 0.5);
    }

    function randomTower() {
      return Math.floor(Math.random() * categories.length);
    }

    // ---- הגודל של אריח: אקראי, אבל טקסט ארוך מקבל אריח גדול שהוא נכנס בו ----
    const measureCanvas = document.createElement("canvas").getContext("2d");

    function longestWordWidth(tile) {
      const style = getComputedStyle(tile);
      measureCanvas.font = style.fontSize + " " + style.fontFamily;
      let widest = 0;
      tile.textContent.split(" ").forEach(function (word) {
        widest = Math.max(widest, measureCanvas.measureText(word).width);
      });
      return widest;
    }

    function sizeTile(tile) {
      // רוחב: לפחות כמו המילה הכי ארוכה, כדי שאף מילה לא תישבר
      const minWidth = Math.max(TILE_MIN_WIDTH, Math.ceil(longestWordWidth(tile)) + TILE_PADDING * 2 + 2);
      let width = randomBetween(minWidth, Math.max(minWidth, TILE_MAX_WIDTH));
      tile.style.width = width + "px";

      // טקסט ארוך באריח צר יורד הרבה שורות ומגביה אותו.
      // במקום שיהיה גבוה מדי, מרחיבים את האריח עד שהטקסט נכנס בגובה המקסימלי
      while (tile.offsetHeight > TILE_MAX_HEIGHT && width < TILE_WIDEST) {
        width = width + 10;
        tile.style.width = width + "px";
      }

      // גובה: לפחות כמו הטקסט, ולכל היותר גובה בינוני.
      // רוב האריחים יוצאים נמוכים, וחלק בינוניים
      const minHeight = Math.max(TILE_MIN_HEIGHT, tile.offsetHeight);
      const height = minHeight + Math.random() * Math.random() * Math.max(0, TILE_MAX_HEIGHT - minHeight);
      tile.style.height = height + "px";
    }

    // ---- איפה אריח נוחת ----
    // מחפש את האריח הכי גבוה שנמצא מתחתיו (מתחת ל-fromTop) ונוגע בו ברוחב. אם אין, נוחת על הרצפה
    function findLandingTop(tile, left, fromTop) {
      const bottom = fromTop + tile.offsetHeight;
      let floor = FRAME_HEIGHT;
      document.querySelectorAll(".task-cube.in-pile").forEach(function (other) {
        if (other === tile) return;
        const otherLeft = Number(other.dataset.left);
        const otherTop = Number(other.dataset.top);
        const overlap = Math.min(left + tile.offsetWidth, otherLeft + other.offsetWidth) - Math.max(left, otherLeft);
        if (overlap > 0 && otherTop >= bottom - 1 && otherTop < floor) {
          floor = otherTop;
        }
      });
      return floor - tile.offsetHeight;
    }

    // ---- נפילה ----
    // נופל עד toTop. כמו כוח משיכה: נפילה ארוכה לוקחת יותר זמן ומאיצה בסוף.
    // בנחיתה יש "מכה" עדינה: האריח נמעך קצת וחוזר
    function fallTo(tile, toTop) {
      const distance = toTop - tile.offsetTop;
      // כל נפילה קצת שונה (עד 15% יותר מהר או לאט), כדי שלא ייראה מכני
      const fallTime = FULL_FALL_TIME * Math.sqrt(Math.max(distance, 0) / FRAME_HEIGHT) * randomBetween(0.85, 1.15);
      tile.style.setProperty("--fall-time", fallTime + "ms");
      tile.classList.add("falling");
      tile.style.top = toTop + "px";

      clearTimeout(tile.fallTimer);
      tile.fallTimer = setTimeout(function () {
        tile.classList.remove("falling");     // אחרי הנחיתה: גרירה בלי השהיה
        tile.classList.remove("landing");
        tile.offsetWidth;                     // מאפס את האנימציה כדי שתתחיל מחדש
        tile.classList.add("landing");
        setTimeout(function () { tile.classList.remove("landing"); }, LANDING_TIME);
      }, fallTime);
    }

    // מכניס אריח למגדל.
    // fromTop = איפה הוא מתחיל (למעלה מחוץ למסך). בלי fromTop הוא פשוט מונח במקום (בהתחלה)
    function putInTower(tile, towerNumber, fromTop) {
      const startTop = fromTop === undefined ? -FRAME_HEIGHT : fromTop;
      let spot = findSpot(tile, towerNumber, startTop);

      // אם האריח היה מכסה את הסיכום, הוא נופל למגדל אחר (בסדר אקראי).
      // אם כל המגדלים מלאים עד שם, הוא נופל למקום הכי נמוך שנמצא
      if (coversSummary(tile, spot)) {
        const otherTowers = categories.map(function (category, number) { return number; });
        otherTowers.sort(function () { return Math.random() - 0.5; });
        for (const number of otherTowers) {
          const otherSpot = findSpot(tile, number, startTop);
          if (!coversSummary(tile, otherSpot)) { spot = otherSpot; break; }
          if (otherSpot.top > spot.top) spot = otherSpot;
        }
      }
      const left = spot.left;
      const landingTop = spot.top;

      // שומרים איפה הוא ינחת, כדי שהאריחים הבאים יידעו לנחות עליו
      tile.dataset.left = left;
      tile.dataset.top = landingTop;
      tile.classList.add("in-pile");
      tile.style.left = left + "px";

      if (fromTop === undefined) {
        tile.style.top = landingTop + "px";   // בהתחלה: כבר למטה
      } else {
        tile.style.top = fromTop + "px";
        tile.offsetTop;                       // גורם לדפדפן "לצייר" את נקודת ההתחלה לפני שזזים
        fallTo(tile, landingTop);
      }
    }

    // מקום במגדל: קצת ימינה או שמאלה מהמרכז (כדי שהמגדל לא יהיה ישר לגמרי), ואיפה הוא ינחת שם
    function findSpot(tile, towerNumber, startTop) {
      const wiggle = Math.max(0, (TOWER_WIDTH - tile.offsetWidth) / 2);
      let left = towerCenter(towerNumber) - tile.offsetWidth / 2 + randomBetween(-wiggle, wiggle);
      left = Math.max(TOWERS_LEFT, Math.min(left, FRAME_WIDTH - tile.offsetWidth));
      return { left: left, top: findLandingTop(tile, left, startTop) };
    }

    // האם אריח במקום הזה יגיע לסיכום בצד ימין למעלה
    function coversSummary(tile, spot) {
      return spot.left + tile.offsetWidth > SUMMARY_LEFT && spot.top < SUMMARY_BOTTOM;
    }

    // כשמוציאים אריח מהמגדל, מה שהיה מעליו נופל למטה (מהנמוך לגבוה)
    function settleTowers() {
      const tiles = Array.from(document.querySelectorAll(".task-cube.in-pile"));
      tiles.sort(function (a, b) {
        return (Number(b.dataset.top) + b.offsetHeight) - (Number(a.dataset.top) + a.offsetHeight);
      });
      tiles.forEach(function (tile) {
        const top = Number(tile.dataset.top);
        const landingTop = findLandingTop(tile, Number(tile.dataset.left), top);
        if (landingTop > top + 0.5) {
          tile.dataset.top = landingTop;
          fallTo(tile, landingTop);
        }
      });
    }

    // יוצר אריח: השם בתוכו, הצבע לפי הקטגוריה (מדריך הצבעים), וגודל אקראי
    function createTile(name, category) {
      const tile = document.createElement("div");
      tile.className = "task-cube cube-" + category;
      tile.textContent = name;                    // שם המשימה בתוך האריח
      tile.title = name;                          // השם המלא מופיע גם כשעוברים עם העכבר
      topLayer = topLayer + 1;
      tile.style.zIndex = topLayer;
      screen.appendChild(tile);
      sizeTile(tile);
      makeDraggable(tile);
      return tile;
    }

    // בהתחלה: המשימות מהמסך הקודם כבר למטה, כל אחת בבסיס המגדל שלה.
    // מחכים שהפונטים ייטענו, כי הם משנים את המידות של הטקסט
    document.fonts.ready.then(function () {
      selectedTasks.forEach(function (task) {
        const tile = createTile(task.name, task.category);
        putInTower(tile, categories.indexOf(task.category));   // הבסיס של המגדל שלה
      });
    });

    // ---------- תת-משימות ----------
    // בכל פעם שתופסים אריח כדי לסדר אותו (בפעם הראשונה שתופסים אותו),
    // נופלות 3 תת-משימות, כל אחת ממשימה ראשית אחרת שנבחרה.
    // כל תת-משימה מוסיפה 1 למספר המשימות ו-0.5 לשעות
    const KID_TASK_HOURS = 0.5;
    const KID_TASKS_PER_GRAB = 3;   // כמה תת-משימות נופלות בכל פעם שתופסים קובייה

    const KID_TASKS = {
      "laundry":      ["separate colors", "add detergent to the list", "hang laundry", "open hanging rack", "fold last weeks laundry",
                       "check pockets", "move laundry to dryer", "hang delicates"],
      "grocery-shop": ["make shopping list", "grab reusable bags", "meal plan for the week", "put groceries away", "find wallet"],
      "school-work":  ["find references", "update Figma", "brainstorm", "do homework", "export final files",
                       "read brief", "find inspiration", "moodboard", "sketch ideas"],
      "pay-bills":    ["fight with bureaucracy", "get card info", "check balance", "save confirmation", "pay electricity"],
      "workout":      ["change clothes", "go to gym", "renew membership", "charge Airpods", "fill water bottle", "pack gym bag"],
      "cook":         ["prep box for tomorrow", "defrost chicken", "clean surface", "pack leftovers", "find recipe"],
      "shower":       ["wash hair", "turn on water heater", "skin care routine", "shave", "floss"],
      "clean":        ["take out garbage", "clean surface", "wash dishes", "sweep floor", "change bed sheets", "tidy room"]
    };

    // התת-משימות שעוד לא הופיעו, רק של המשימות שנבחרו
    const kidTasksLeft = {};
    selectedTasks.forEach(function (task) {
      if (KID_TASKS[task.category]) {
        kidTasksLeft[task.category] = KID_TASKS[task.category].slice();  // עותק של הרשימה
      }
    });

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function addKidTasks() {
      // משימות ראשיות שעוד נשארו להן תת-משימות, בסדר אקראי
      const parents = Object.keys(kidTasksLeft).filter(function (category) {
        return kidTasksLeft[category].length > 0;
      });
      if (parents.length === 0) return;  // נגמרו התת-משימות, לא מתזמנים עוד נפילה
      parents.sort(function () { return Math.random() - 0.5; });

      // אם נשארו פחות משימות ראשיות עם תת-משימות, נופלות פחות
      parents.slice(0, KID_TASKS_PER_GRAB).forEach(function (category, dropNumber) {
        const name = randomItem(kidTasksLeft[category]);
        kidTasksLeft[category].splice(kidTasksLeft[category].indexOf(name), 1);  // לא תופיע שוב

        // נופל מלמעלה, מחוץ למסך, אל מגדל אקראי.
        // הראשון מתחיל ליפול מיד כשתופסים אריח (בלי הפסקה), והשאר בזמן אקראי אחריו
        const tile = createTile(name, category);
        const delay = dropNumber === 0 ? 0 : randomBetween(0, KID_DROP_SPREAD);
        tile.style.visibility = "hidden";
        setTimeout(function () {
          tile.style.visibility = "";
          putInTower(tile, randomTower(), -tile.offsetHeight);
        }, delay);

        tasksCount = tasksCount + 1;
        totalHours = totalHours + KID_TASK_HOURS;
      });
      showSummary();
    }

    // ---------- גרירה ----------
    function makeDraggable(tile) {
      tile.addEventListener("pointerdown", function (event) {
        // כל המסך מוקטן כדי להיכנס לחלון, אז ממירים את תזוזת העכבר לגודל של הפריים
        const scale = Number(getComputedStyle(document.documentElement).getPropertyValue("--screen-scale")) || 1;
        const startMouseX = event.clientX, startMouseY = event.clientY;
        const startLeft = tile.offsetLeft, startTop = tile.offsetTop;

        // תופסים את האריח איפה שהוא עכשיו (גם באמצע נפילה)
        clearTimeout(tile.fallTimer);
        tile.classList.remove("falling", "landing");
        tile.style.top = startTop + "px";

        tile.setPointerCapture(event.pointerId);  // ממשיכים לגרור גם אם העכבר "בורח" מהאריח
        tile.classList.add("dragging");
        topLayer = topLayer + 1;
        tile.style.zIndex = topLayer;

        // אריח שהוצא מהמגדל: מה שהיה מעליו נופל למטה
        if (tile.classList.contains("in-pile")) {
          tile.classList.remove("in-pile");
          settleTowers();
        }

        // בפעם הראשונה שתופסים אריח כדי לסדר אותו, נופלים עוד אריחים
        if (!tile.dataset.grabbed) {
          tile.dataset.grabbed = "yes";
          addKidTasks();
        }

        function moveTile(moveEvent) {
          let left = startLeft + (moveEvent.clientX - startMouseX) / scale;
          let top = startTop + (moveEvent.clientY - startMouseY) / scale;
          // לא נותנים לאריח לצאת מהמסך
          left = Math.max(0, Math.min(left, FRAME_WIDTH - tile.offsetWidth));
          top = Math.max(0, Math.min(top, FRAME_HEIGHT - tile.offsetHeight));
          tile.style.left = left + "px";
          tile.style.top = top + "px";
        }

        function dropTile() {
          tile.classList.remove("dragging");
          tile.removeEventListener("pointermove", moveTile);
          tile.removeEventListener("pointerup", dropTile);
        }

        tile.addEventListener("pointermove", moveTile);
        tile.addEventListener("pointerup", dropTile);
      });
    }
  </script>

</body>
</html>
